name = "danscarlot"
main = "worker/index.ts"
compatibility_date = "2025-02-11"

[observability]
enabled = true
head_sampling_rate = 1

[[D1_database]]
name = "danscarlot-db"
binding = "DB"
id = "59eeb9c6-7659-4fa3-a8b6-858d6a9553d2"

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "CAR_STORE"
class_name = "CarStore"

[[migrations]]
tag = "v1"
new_classes = ["CarStore"]

# Custom domain configuration - single origin serves both the SPA and /api/*
[[routes]]
pattern = "danscarlot.turneratlanta.com/*"
zone_id = "621eb120d82997c4af1a61d0a6ecce9a"

# Staging environment (used for testing before promoting to production)
[env.staging]
name = "danscarlot-staging"
